plugins {
    id 'com.android.application'
}

android {
    namespace 'ma.nobtk.app'
    compileSdk 34

    defaultConfig {
        applicationId 'ma.nobtk.app'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    // Two apps from the same code: the barber app and the owner's admin app.
    flavorDimensions 'app'
    productFlavors {
        barber {
            dimension 'app'
            applicationId 'ma.nobtk.app'
            resValue 'string', 'app_name', 'NOBTK'
            buildConfigField 'String', 'START_URL', '"https://mcloviinn777.github.io/nobtk/index.html#barber"'
        }
        admin {
            dimension 'app'
            applicationId 'ma.nobtk.admin'
            resValue 'string', 'app_name', 'NOBTK Admin'
            buildConfigField 'String', 'START_URL', '"https://mcloviinn777.github.io/nobtk/admin.html"'
        }
    }

    // Fixed test key: every new APK installs over the previous one (no need to uninstall).
    // Test builds only; the Play Store version will use its own private upload key.
    signingConfigs {
        test {
            storeFile file('nobtk-test.keystore')
            storePassword 'nobtktest'
            keyAlias 'nobtk'
            keyPassword 'nobtktest'
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.test
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
