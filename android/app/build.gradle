plugins {
    id 'com.android.application'
}

android {
    namespace 'ma.nobtk.app'
    compileSdk 34

    defaultConfig {
        applicationId 'ma.nobtk.app'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // Two apps from the same code: the barber app and the owner's admin app.
    flavorDimensions 'app'
    productFlavors {
        barber {
            dimension 'app'
            applicationId 'ma.nobtk.app'
            resValue 'string', 'app_name', 'NOBTK'
            buildConfigField 'String', 'START_URL', '"https://mcloviinn777.github.io/nobtk/index.html#barber"'
        }
        admin {
            dimension 'app'
            applicationId 'ma.nobtk.admin'
            resValue 'string', 'app_name', 'NOBTK Admin'
            buildConfigField 'String', 'START_URL', '"https://mcloviinn777.github.io/nobtk/admin.html"'
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
