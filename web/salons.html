<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trouve ton salon · NOBTK</title>
<meta name="description" content="Trouve ton barbier et prends ton tour sans attendre.">
<meta name="theme-color" content="#3A31D2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NOBTK">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=Tajawal:wght@500;700&display=swap">
<style>
:root{--bg:#F2F1FA;--surface:#fff;--surface-2:#E9E8F6;--ink:#15143A;--muted:#5D5C86;--line:#DEDDF0;--primary:#3A31D2;--accent:#FFC53D;--accent-ink:#2B1E00;--ok:#13895A;--warn:#B76E00}
@media (prefers-color-scheme:dark){:root{--bg:#0C0B20;--surface:#16153A;--surface-2:#201F4A;--ink:#F1F0FF;--muted:#A09FC9;--line:#2B2A58;--ok:#3CCB8A;--warn:#FFB547}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,Tajawal,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
[dir=rtl] body{font-family:Tajawal,Manrope,system-ui,sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:10px}
.top img{width:38px;height:38px;border-radius:10px}
.top b{font-family:"Bricolage Grotesque",Manrope,sans-serif;font-size:22px;letter-spacing:.5px;margin-inline-end:auto}
.lang{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;font-weight:700;font-size:14px}
.hero{background:var(--primary);color:#fff;border-radius:22px;padding:20px}
.hero h1{margin:0 0 4px;font-family:"Bricolage Grotesque",Manrope,Tajawal,sans-serif;font-size:27px;line-height:1.1}
[dir=rtl] .hero h1{font-family:Tajawal,sans-serif}
.hero p{margin:0 0 14px;color:#D9D6FF}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:0 14px;color:#15143A}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:17px;padding:14px 0;color:#15143A;min-width:0}
.cities{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cities button{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;font-size:14px}
.cities button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lbl{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 2px -4px}
.list{display:flex;flex-direction:column;gap:10px}
.shop{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;text-decoration:none;color:inherit}
.shop:active{transform:scale(.99)}
.shop.mine{border:1.5px solid var(--primary)}
.av{width:62px;height:62px;border-radius:16px;flex:none;object-fit:cover;background:var(--surface-2)}
.ini{width:62px;height:62px;border-radius:16px;flex:none;display:grid;place-items:center;background:var(--primary);color:var(--accent);font-family:"Bricolage Grotesque",Manrope,sans-serif;font-weight:800;font-size:24px}
.info{flex:1;min-width:0}
.info b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{display:block;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-top:3px}
.st i{width:8px;height:8px;border-radius:50%;background:currentColor}
.st.on{color:var(--ok)}.st.pause{color:var(--warn)}.st.off{color:var(--muted)}
.go{color:var(--primary);flex:none}
[dir=rtl] .go{transform:scaleX(-1)}
.empty{text-align:center;color:var(--muted);padding:28px 10px;background:var(--surface);border-radius:18px;border:1px dashed var(--line)}
.foot{text-align:center;font-size:14px;color:var(--muted)}
.foot a{color:var(--primary);font-weight:700}
.sk{height:88px;border-radius:18px;background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="icon-192.png" alt=""><b>NOBTK</b><button class="lang" id="lang" type="button">العربية</button></div>
  <section class="hero">
    <h1 data-t="h1"></h1>
    <p data-t="sub"></p>
    <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" autocomplete="off"></label>
  </section>
  <div class="cities" id="cities"></div>
  <div class="lbl" id="mineLbl" hidden data-t="mine"></div>
  <div class="list" id="mine" hidden></div>
  <div class="lbl" id="allLbl" data-t="all"></div>
  <div class="list" id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <p class="foot"><span data-t="barber"></span> <a href="installer.html" data-t="barber_a"></a><br><a href="confidentialite.html" style="font-weight:600">Confidentialité</a></p>
</div>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  var ls={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  var T={
    fr:{h1:"Trouve ton salon",sub:"Choisis ton barbier et prends ton tour sans attendre.",ph:"Nom du salon ou ville",mine:"Ton salon",all:"Tous les salons",allc:"Toutes",on:"Ouvert · file en direct",pause:"En pause",off:"Fermé pour l'instant",none:"Aucun salon trouvé. Essaie un autre nom ou une autre ville.",err:"Impossible de charger les salons. Vérifie ta connexion et réessaie.",barber:"Tu es barbier ?",barber_a:"Installe NOBTK",n:"{n} salons",waiting:"{n} en attente"},
    ar:{h1:"لقا الصالون ديالك",sub:"ختار الحلاق ديالك وخود نوبتك بلا ما تسنى.",ph:"سمية الصالون ولا المدينة",mine:"الصالون ديالك",all:"كاع الصالونات",allc:"الكل",on:"محلول · الصف مباشر",pause:"واقف شوية",off:"مسدود دابا",none:"ما لقينا حتى صالون. جرب سمية أخرى ولا مدينة أخرى.",err:"ما قدرناش نجيبو الصالونات. شوف الانترنت وعاود.",barber:"نتا حلاق؟",barber_a:"ثبت NOBTK",n:"{n} صالونات",waiting:"{n} كيتسناو"}
  };
  var lang=ls.get("nobtk-lang","fr");if(lang!=="ar")lang="fr";
  var shops=null,city="",q="";
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
  var norm=function(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim()};
  var t=function(k,v){var s=(T[lang][k]||T.fr[k]||k);if(v)for(var x in v)s=s.split("{"+x+"}").join(v[x]);return s};
  // outside the opening hours a salon is closed, whatever its phone says
  function inHours(s){var h=s.hours;if(!Array.isArray(h)||h.length<7)return true;var now=new Date(),min=now.getHours()*60+now.getMinutes();var hm=function(v){var m=/^(\d{1,2}):(\d{2})/.exec(v||"");return m?(+m[1])*60+(+m[2]):null};
   var y=h[(now.getDay()+5)%7];if(y&&y.open){var f0=hm(y.from),t0=hm(y.to);if(f0!=null&&t0!=null&&t0<f0&&min<t0)return true}
   var d=h[(now.getDay()+6)%7];if(!d||!d.open)return false;var f=hm(d.from),to=hm(d.to);if(f==null||to==null)return true;var end=to<=f?to+1440:to;return min>=f&&min<end}
  function state(s){if(!inHours(s))return"off";if(s.paused)return"pause";return(Date.now()-(s.lastSeen||0)<4*60000)?"on":"off"}
  function card(s,mine){
    var st=state(s),ini=esc((s.name||"?").trim().charAt(0).toUpperCase());
    var av=s.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(s.photo)?'<img class="av" src="'+esc(s.photo)+'" alt="" onerror="this.outerHTML=\'<div class=ini>'+ini+'</div>\'">':'<div class="ini">'+ini+'</div>';
    var place=[s.city,s.address].filter(Boolean).join(" · ");
    return '<a class="shop'+(mine?' mine':'')+'" href="index.html?s='+encodeURIComponent(s.id)+'#client" data-id="'+esc(s.id)+'">'+av+
      '<div class="info"><b>'+esc(s.name)+'</b>'+(place?'<span>'+esc(place)+'</span>':'')+'<div class="st '+st+'"><i></i>'+t(st)+'</div></div>'+
      '<svg class="go" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>';
  }
  function render(){
    document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
    document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.dataset.t)});
    $("q").placeholder=t("ph");$("lang").textContent=lang==="ar"?"Français":"العربية";
    if(!shops)return;
    var mineId=ls.get("nobtk-shop",null),mine=shops.find(function(s){return s.id===mineId});
    $("mine").hidden=$("mineLbl").hidden=!mine||!!q||!!city;
    $("mine").innerHTML=mine?card(mine,true):"";
    var cities=[];shops.forEach(function(s){var c=(s.city||"").trim();if(c&&!cities.some(function(x){return norm(x)===norm(c)}))cities.push(c)});
    cities.sort();
    $("cities").hidden=cities.length<2;
    $("cities").innerHTML=['<button type="button" data-c="" aria-pressed="'+(!city)+'">'+t("allc")+'</button>'].concat(cities.map(function(c){return'<button type="button" data-c="'+esc(c)+'" aria-pressed="'+(norm(c)===norm(city))+'">'+esc(c)+'</button>'})).join("");
    var nq=norm(q);
    var list=shops.filter(function(s){return(!city||norm(s.city)===norm(city))&&(!nq||norm(s.name).indexOf(nq)>-1||norm(s.city).indexOf(nq)>-1||norm(s.address).indexOf(nq)>-1)});
    var rank={on:0,pause:1,off:2};
    list.sort(function(a,b){return(rank[state(a)]-rank[state(b)])||String(a.name).localeCompare(String(b.name))});
    $("allLbl").textContent=t("all")+" · "+t("n",{n:list.length});
    $("list").innerHTML=list.length?list.map(function(s){return card(s,false)}).join(""):'<div class="empty">'+t("none")+'</div>';
  }
  $("q").oninput=function(e){q=e.target.value;render()};
  $("cities").onclick=function(e){var b=e.target.closest("button");if(!b)return;city=b.dataset.c;render()};
  $("lang").onclick=function(){lang=lang==="ar"?"fr":"ar";ls.set("nobtk-lang",lang);render()};
  document.addEventListener("click",function(e){var a=e.target.closest(".shop");if(a){ls.set("nobtk-shop",a.dataset.id);if(ls.get("nobtk-role",null)!=="barber")ls.set("nobtk-role","client")}});
  render();
  try{
    var C=window.NOBTK_CONFIG||{};
    if(!window.firebase||!C.firebase)throw new Error("no-firebase");
    var app=firebase.apps.length?firebase.app():firebase.initializeApp(C.firebase);
    firebase.firestore(app).collection("shops").get().then(function(snap){
      shops=[];snap.forEach(function(d){var s=d.data()||{};if(s.name&&s.active!==false&&s.listed!==false)shops.push(Object.assign({id:d.id},s))});
      render();
    }).catch(function(e){console.warn(e);$("list").innerHTML='<div class="empty">'+t("err")+'</div>'});
  }catch(e){$("list").innerHTML='<div class="empty">'+t("err")+'</div>'}
})();
</script>
</body>
</html>
