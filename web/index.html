<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOBTK</title>
<meta name="theme-color" content="#3A31D2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: app shell with sticky top bar; views = client (phone-first), barber (dashboard grid), screen (TV), demo (phone frame + dashboard side by side) */
:root{
  --bg:#F2F1FA; --surface:#FFFFFF; --surface-2:#E9E8F6; --ink:#15143A; --muted:#64638C; --line:#DEDDF0;
  --primary:#3A31D2; --primary-ink:#FFFFFF; --primary-soft:#E4E2FF;
  --accent:#FFC53D; --accent-ink:#2B1E00;
  --ok:#14936A; --ok-soft:#DDF4EA; --warn:#C77700; --warn-soft:#FFF0D6; --bad:#D23C4A; --bad-soft:#FDE3E5;
  --frame:#15143A; --shadow:0 1px 2px rgba(21,20,58,.06),0 8px 24px rgba(21,20,58,.08);
  --f-display:"Bricolage Grotesque","Tajawal",system-ui,sans-serif;
  --f-body:"Manrope","Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0B20; --surface:#16153A; --surface-2:#201F4A; --ink:#F1F0FF; --muted:#A09FC9; --line:#2B2A58;
  --primary:#6C63FF; --primary-ink:#FFFFFF; --primary-soft:#26245E;
  --accent:#FFC53D; --accent-ink:#2B1E00;
  --ok:#3CCB97; --ok-soft:#123A30; --warn:#FFB43D; --warn-soft:#3A2C10; --bad:#FF6B78; --bad-soft:#3E1A22;
  --frame:#000000; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C0B20; --surface:#16153A; --surface-2:#201F4A; --ink:#F1F0FF; --muted:#A09FC9; --line:#2B2A58;
  --primary:#6C63FF; --primary-ink:#FFFFFF; --primary-soft:#26245E;
  --accent:#FFC53D; --accent-ink:#2B1E00;
  --ok:#3CCB97; --ok-soft:#123A30; --warn:#FFB43D; --warn-soft:#3A2C10; --bad:#FF6B78; --bad-soft:#3E1A22;
  --frame:#000000; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
[dir="rtl"]{font-family:"Tajawal",var(--f-body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{font-family:"Tajawal",var(--f-display);letter-spacing:0}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.1}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.pill.live{color:var(--ok);background:var(--ok-soft)}
.pill.live .dot{animation:pulse 1.6s infinite}
.pill.paused{color:var(--warn);background:var(--warn-soft)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1320px;margin:0 auto}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--primary);color:var(--primary-ink)}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.okb{background:var(--ok);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
[dir="rtl"] .lbl{letter-spacing:0}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px;width:100%}
.field input:focus{border-color:var(--primary);outline:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.app{background:var(--primary-soft);color:var(--primary)}
.chip.way{background:var(--ok-soft);color:var(--ok)}
.chip.ph{background:var(--warn-soft);color:var(--warn)}
.muted{color:var(--muted)}
.lq{display:flex;flex-direction:column;gap:8px}
.lq-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.lq-row.me{background:var(--primary);color:var(--primary-ink)}
.lq-row .bdg{font-family:var(--f-display);font-weight:800;font-size:20px;min-width:46px;height:42px;padding:0 8px;border-radius:11px;display:grid;place-items:center;background:var(--surface);color:var(--primary)}
.lq-row.me .bdg{background:var(--accent);color:var(--accent-ink)}
.lq-row.free .bdg{color:var(--muted)}
.lq-row .lbl2{flex:1;min-width:0;font-weight:700}
.lq-row .lbl2 small{display:block;font-weight:500;opacity:.75;font-size:12.5px}
.lq-row .tm{font-size:13px;font-weight:700;white-space:nowrap}
.lq-sep{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.lineviz{position:relative;z-index:1;margin-top:12px;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.lv-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lv-row i{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.3);flex:none}
.lv-row i.ch{background:var(--accent)}
.lv-row i.fr{background:transparent;border:2px solid rgba(255,255,255,.45)}
.lv-row i.you{background:transparent;border:2px dashed var(--accent);width:34px}
.lv-row .sep{width:2px;height:22px;background:rgba(255,255,255,.4);margin:0 4px;border-radius:2px}
.lv-row b{font-size:12px;font-weight:700;opacity:.9}
.lv-leg{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;opacity:.85}
.lv-leg span{display:inline-flex;align-items:center;gap:5px}
.lv-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:600}
.warnbox.bad{background:var(--bad-soft);color:var(--bad)}
.policy{margin:0;font-size:12.5px;color:var(--muted);text-align:center}
.cdbox{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.12);border-radius:16px;padding:10px 18px}
.cdbox span{font-size:13px;opacity:.85}.cdbox .cd{font-family:var(--f-display);font-size:34px;color:var(--accent)}.cd-over{font-size:14px;max-width:260px}

svg.i{width:18px;height:18px;flex:none}

/* ---------- Client ---------- */
.cv{position:relative;max-width:460px;margin:0 auto}
.cv-body{display:flex;flex-direction:column;gap:14px}
.hero{background:var(--primary);color:var(--primary-ink);border-radius:22px;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--accent);opacity:.95}
.hero h1{font-size:26px;position:relative;z-index:1;max-width:75%}
.hero p{margin:6px 0 0;opacity:.85;position:relative;z-index:1}
.livebox{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1;margin-top:16px}
.livebox div{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.livebox b{font-family:var(--f-display);font-size:28px;display:block;line-height:1.1}
.livebox span{font-size:12px;opacity:.85}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps3 div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:12.5px;font-weight:600}
.steps3 i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:800;margin-bottom:6px}
.svc-list{display:grid;gap:8px}
.svc{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);text-align:start;width:100%}
.svc[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
.svc .rad{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.svc[aria-checked="true"] .rad{border-color:var(--primary)}
.svc[aria-checked="true"] .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.svc .nm{flex:1;min-width:0;font-weight:700}
.svc .nm small{display:block;font-weight:500;color:var(--muted)}
.svc .pr{font-weight:800;font-family:var(--f-display);white-space:nowrap}
.join{display:flex;flex-direction:column;gap:12px}
.err{color:var(--bad);font-size:13px;font-weight:600}

/* ticket */
.ticket{background:var(--primary);color:var(--primary-ink);border-radius:22px;position:relative;overflow:hidden}
.ticket .tt{padding:18px 20px 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.ticket .tno{font-family:var(--f-display);font-weight:800;font-size:76px;line-height:.9;color:var(--accent)}
.ticket .shop{font-weight:700;opacity:.9}
.ticket .perf{height:0;border-top:2px dashed rgba(255,255,255,.35);margin:0 18px;position:relative}
.ticket .perf::before,.ticket .perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.ticket .perf::before{left:-30px}.ticket .perf::after{right:-30px}
.ticket .tb{padding:18px 20px;display:flex;align-items:center;gap:16px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .v b{font-family:var(--f-display);font-size:30px;display:block}
.ring .v span{font-size:11px;opacity:.85}
.tstat{flex:1;min-width:0}
.tstat h2{font-size:21px}
.tstat p{margin:4px 0 0;opacity:.85;font-size:14px}
.ahead{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ahead i{width:14px;height:14px;border-radius:5px;background:rgba(255,255,255,.3)}
.ahead i.me{background:var(--accent);width:28px}
.ahead i.ch{background:rgba(255,255,255,.75)}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.track div{font-size:11.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.track div::before{content:"";height:5px;border-radius:5px;background:var(--line)}
.track div.on{color:var(--ink)}
.track div.on::before{background:var(--primary)}
.track div.now::before{background:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{text-align:end}
.notif-card{display:flex;flex-direction:column;gap:10px}
.notif-st{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.hist{display:flex;flex-direction:column;gap:6px;max-height:170px;overflow:auto}
.hist div{display:flex;gap:8px;font-size:13px;align-items:baseline}
.hist time{color:var(--muted);font-size:12px;flex:none}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}
.opts button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.state-soon .ticket{background:linear-gradient(160deg,var(--primary),#2a22a8)}
.done-card{text-align:center;padding:28px 18px}
.done-card .big{font-size:44px;font-family:var(--f-display);font-weight:800;color:var(--primary)}

/* banners (in-app notifications) */
.banners{position:absolute;top:8px;left:8px;right:8px;z-index:30;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.cv.standalone .banners{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:50%;right:auto;transform:translateX(-50%);width:min(440px,calc(100% - 24px))}
.banner{pointer-events:auto;display:flex;gap:12px;align-items:flex-start;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 12px 32px rgba(10,8,40,.25);border-radius:18px;padding:12px 14px;animation:drop .35s cubic-bezier(.2,1.2,.4,1)}
.banner .ic{width:36px;height:36px;border-radius:10px;background:var(--primary);display:grid;place-items:center;flex:none;color:var(--accent)}
.banner b{display:block;font-size:14px}
.banner p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.banner small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
@keyframes drop{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
.called-ov{position:absolute;inset:0;z-index:40;background:var(--primary);color:var(--primary-ink);border-radius:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
.cv.standalone .called-ov{position:fixed;border-radius:0;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.called-ov .pulse{width:150px;height:150px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:64px;box-shadow:0 0 0 0 rgba(255,197,61,.6);animation:ring 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,197,61,.6)}100%{box-shadow:0 0 0 36px rgba(255,197,61,0)}}
.called-ov h2{font-size:34px}
.called-ov p{margin:0;font-size:17px;opacity:.9}

/* ---------- Barber ---------- */
.bv{display:flex;flex-direction:column;gap:16px}
.bhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bhead h1{font-size:26px;margin-inline-end:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.15}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.chairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.chair{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:178px}
.chair.st-chair{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.chair.st-called{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chair-h{display:flex;justify-content:space-between;align-items:center}
.chair-h .lbl{display:flex;gap:6px;align-items:center}
.chair .who{display:flex;gap:12px;align-items:center}
.badge{font-family:var(--f-display);font-weight:800;font-size:22px;min-width:52px;height:52px;padding:0 8px;border-radius:14px;display:grid;place-items:center;background:var(--primary);color:var(--accent)}
.badge.sm{min-width:40px;height:40px;font-size:17px;border-radius:11px}
.badge.free{background:var(--surface-2);color:var(--muted)}
.who b{display:block;font-size:16px}
.who span{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:6px}
.bar.over i{background:var(--warn)}
.chair .acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.chair .acts .btn{flex:1}
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.qlist{display:flex;flex-direction:column}
.qrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .info{flex:1;min-width:0}
.qrow .info b{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qrow .info span{font-size:13px;color:var(--muted)}
.qrow .eta{text-align:end;font-size:13px;color:var(--muted);white-space:nowrap}
.qrow .eta b{display:block;color:var(--ink);font-size:15px}
.ibtn{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.ibtn:hover{color:var(--ink)}
.qrow.fresh{animation:flash 1.6s}
@keyframes flash{0%{background:var(--accent)}100%{background:transparent}}
.side{display:flex;flex-direction:column;gap:16px}
.srcsw{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.empty{padding:26px 10px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty svg{width:42px;height:42px;color:var(--primary)}
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px));z-index:50;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);animation:drop .3s}
.toast i{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
details.set summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.set summary::-webkit-details-marker{display:none}
details.set[open] summary{margin-bottom:12px}
.setg{display:flex;flex-direction:column;gap:12px}
.stepper{display:flex;gap:6px}
.stepper button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-weight:800}
.stepper button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}

/* ---------- Screen (TV) ---------- */
.tv{background:var(--primary);color:var(--primary-ink);border-radius:26px;padding:clamp(18px,4vw,40px);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(16px,3vw,36px);min-height:70vh}
.tv h2{font-size:clamp(20px,2.4vw,30px);opacity:.9}
.tv .now{display:grid;gap:14px;align-content:start}
.tvchair{background:rgba(255,255,255,.1);border-radius:20px;padding:16px 20px;display:flex;align-items:center;gap:18px}
.tvchair .n{font-family:var(--f-display);font-weight:800;font-size:clamp(54px,8vw,110px);line-height:.9;color:var(--accent);min-width:2.2ch}
.tvchair .n.free{color:rgba(255,255,255,.35)}
.tvchair b{font-size:clamp(16px,1.8vw,24px);display:block}
.tvchair span{opacity:.8}
.tvchair.called{animation:tvblink 1.2s 4}
@keyframes tvblink{50%{background:rgba(255,197,61,.35)}}
.tv .nexts{display:flex;flex-wrap:wrap;gap:10px}
.tv .nexts span{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.4vw,46px);background:rgba(255,255,255,.12);border-radius:14px;padding:6px 16px}
.tv .side2{display:flex;flex-direction:column;gap:18px}
.tv .clock{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,6vw,84px);line-height:1}
.tv .cta{margin-top:auto;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px}
.tv .cta b{font-family:var(--f-display);font-size:clamp(20px,2.2vw,30px);display:block}

/* ---------- Demo ---------- */
.demo{display:grid;grid-template-columns:400px minmax(0,1fr);gap:24px;align-items:start}
.phone{width:100%;max-width:390px;margin:0 auto;border:10px solid var(--frame);border-radius:46px;background:var(--bg);height:min(800px,calc(100vh - 120px));min-height:620px;position:sticky;top:84px;overflow:hidden;box-shadow:0 24px 60px rgba(21,20,58,.25)}
.phone .scr{height:100%;overflow:auto;padding:38px 14px 20px;position:relative}
.phone .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:var(--frame);border-radius:20px;z-index:45}
.phone .cv{position:static}
.phone .banners{top:42px}
.phone .called-ov{border-radius:36px}
.demo-cap{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin-top:10px}
.loading{padding:40px 10px;text-align:center;color:var(--muted)}

@media (max-width:1100px){.qwrap{grid-template-columns:1fr}}
@media (max-width:980px){.demo{grid-template-columns:1fr}.phone{position:relative;top:0}.tv{grid-template-columns:1fr}}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}.brand small{display:none}.hero h1{font-size:23px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pin{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:14px;text-align:center}

function startDb(db,shopId){

 const got={t:false,s:false,c:false};let fellBack=false,slow=null;
 const done=()=>{if(fellBack)return;if(got.t&&got.s&&got.c&&!Store.ready){Store.ready=true;clearTimeout(slow)}Store.emit()};
 const fail=e=>{console.warn("db",e);if(!Store.ready&&!fellBack){fellBack=true;clearTimeout(slow);startLocal()}};
 slow=setTimeout(()=>{if(!Store.ready&&!fellBack){fellBack=true;startLocal()}},12000);
 shopRef.onSnapshot(s=>{if(fellBack)return;Store.shop={...DEFAULT_SHOP,...(s.exists?s.data():{})};got.s=true;done()},fail);
 col.onSnapshot(s=>{if(fellBack)return;Store.tickets=s.docs.map(d=>({id:d.id,...d.data()}));got.t=true;done()},fail);
 cl.onSnapshot(s=>{if(fellBack)return;Store.clients=s.docs.map(d=>({id:d.id,...d.data()}));got.c=true;done()},fail);
 Store.setTicket=(id,d)=>col.doc(id).set(d).catch(writeFail);
 Store.patchTicket=(id,p)=>col.doc(id).update(p).catch(writeFail);

}

function durMin(id){
 const done=Store.tickets.filter(x=>x.status==="done"&&x.svc===id&&x.startedAt&&x.doneAt);
 if(done.length>=3){const avg=done.reduce((a,x)=>a+(x.doneAt-x.startedAt),0)/done.length/60000;return Math.max(5,Math.round(avg))}
 return svc(id).min}
const inChairSt=x=>x.status==="chair"||x.status==="called";
function Q(){
 const all=Store.tickets.slice().sort((a,b)=>a.num-b.num);
 const chairs=Math.max(1,Math.min(4,+Store.shop.chairs||1));
 const waiting=all.filter(x=>x.status==="waiting").sort((a,b)=>(a.pos??a.num)-(b.pos??b.num));
 const inChair=Array.from({length:chairs},(_,i)=>all.find(x=>inChairSt(x)&&x.chair===i)||null);
 const now=Date.now();
 const free=inChair.map(x=>{if(!x)return 0;const d=durMin(x.svc)*60000;return Math.max(60000,(x.startedAt||x.calledAt||now)+d-now)});
 const eta={},ahead={};
 waiting.forEach((x,i)=>{let k=0;for(let j=1;j<free.length;j++)if(free[j]<free[k])k=j;eta[x.id]=free[k];ahead[x.id]=i;free[k]+=durMin(x.svc)*60000});
 const nextFree=Math.min(...free);
 const done=all.filter(x=>x.status==="done"),noshow=all.filter(x=>x.status==="noshow");
 return {all,chairs,waiting,inChair,eta,ahead,nextFree,done,noshow};
}
const phoneKey=p=>{let d=String(p||"").replace(/\D/g,"");if(d.startsWith("212"))d="0"+d.slice(3);if(d.length===9&&/^[5-7]/.test(d))d="0"+d;return /^0[5-7]\d{8}$/.test(d)?d:null};
function clientRec(phone){const k=phoneKey(phone);if(!k)return null;const c=Store.clients.find(x=>x.id===k);if(!c)return null;
 if(c.blockedUntil&&c.blockedUntil<Date.now())return {...c,strikes:0,blockedUntil:null};return c}
const strikesOf=phone=>(clientRec(phone)||{}).strikes||0;
const graceMs=()=>(+Store.shop.grace||5)*60000;
const blockDays=()=>+Store.shop.blockDays||7;
const dateStr=ts=>new Date(ts).toLocaleDateString(lang==="ar"?"ar-MA":"fr-MA",{weekday:"long",day:"numeric",month:"long"});
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function strikeMsg(s,bu){if(bu&&bu>Date.now())return t("strike_block",{d:dateStr(bu)});if(s>=2)return t("strike_2",{d:blockDays()});if(s===1)return t("strike_1");return""}

 async join({name,phone,svcId,src}){const q=Q();const num=(q.all.reduce((m,x)=>Math.max(m,x.num||0),0))+1;const id=newId();

  await Store.setTicket(id,d);await A.fill();return id},
 // Puts the first person in line into every free chair. Runs after any change that can free a chair.
 async fill(){const used=new Set();const n=Q().chairs;for(let i=0;i<n;i++){const q=Q();if(q.inChair[i])continue;const w=q.waiting.find(x=>!used.has(x.id));if(!w)return;used.add(w.id);await Store.patchTicket(w.id,{status:"chair",chair:i,startedAt:Date.now()})}},
 async finish(id){const x=Store.tickets.find(y=>y.id===id);if(!x)return;await Store.patchTicket(id,{status:"done",doneAt:Date.now(),startedAt:x.startedAt||Date.now()});await A.fill()},
 async absent(id){const x=Store.tickets.find(y=>y.id===id);if(!x)return;const now=Date.now();const k=phoneKey(x.phone);let s=null,bu=null;
  if(k){s=strikesOf(x.phone)+1;if(s>=MAX_STRIKES)bu=now+blockDays()*864e5;await Store.setClient(k,{phone:k,name:x.name,strikes:s,lastNoShow:now,blockedUntil:bu})}
  await Store.patchTicket(id,{status:"noshow",chair:null,noshowAt:now,strike:s,blockedUntil:bu});await A.fill()},
 async delay(id){const x=Store.tickets.find(y=>y.id===id);const w=Q().waiting;if(!x||!w.length||x.delayed)return;
  const a=w[Math.min(1,w.length-1)],b=w.length>2?w[2]:null;const pa=a.pos??a.num;const pos=b?(pa+(b.pos??b.num))/2:pa+1;
  await Store.patchTicket(id,{status:"waiting",chair:null,startedAt:null,pos,delayed:true,onWay:false});await A.fill()},
 async forgive(k){const c=Store.clients.find(x=>x.id===k);if(!c)return;await Store.setClient(k,{phone:c.phone||k,name:c.name||"",strikes:0,lastNoShow:c.lastNoShow||null,blockedUntil:null})},

 async up(id){const w=Q().waiting;const i=w.findIndex(x=>x.id===id);if(i<1)return;const a=w[i],b=w[i-1];const pa=a.pos??a.num,pb=b.pos??b.num;await Store.patchTicket(a.id,{pos:pb});await Store.patchTicket(b.id,{pos:pa})},
 async examples(){const names=["Youssef","Amine","Hamza","Mehdi","Ayoub","Othmane","Zakaria","Karim"];const svcs=["degrade","combo","coupe","barbe","degrade","enfant"];const srcs=["app","walkin","app","phone","app","app"];

  $("abs").innerHTML=abs.length?abs.map(c=>{const blocked=c.blockedUntil&&c.blockedUntil>now;return `<div class="qrow"><div class="info"><b>${esc(c.name||c.id)} <span class="chip ${blocked?"bad":"ph"}">${blocked?t("b_blocked"):t("b_strike_chip",{s:c.strikes})}</span></b><span class="num">${esc(c.id)}${blocked?" · "+t("b_until",{d:dateStr(c.blockedUntil)}):""}</span></div><button class="btn ghost sm" data-forgive="${esc(c.id)}" type="button">${t("b_forgive")}</button></div>`}).join("")
   :`<div class="muted" style="font-size:13px;padding:6px 0">${t("b_abs_none")}</div>`;
  $("nch").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.n===q.chairs));
  $("grace").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.n===(+Store.shop.grace||5)));
  $("bdays").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.n===blockDays()));
  root.querySelectorAll("[data-fill]").forEach(b=>b.onclick=()=>A.fill());
  root.querySelectorAll("[data-fin]").forEach(b=>b.onclick=()=>{noshowArm=null;A.finish(b.dataset.fin)});
  root.querySelectorAll("[data-nsarm]").forEach(b=>b.onclick=()=>{noshowArm=b.dataset.nsarm;update();setTimeout(()=>{if(noshowArm===b.dataset.nsarm){noshowArm=null;update()}},8000)});
  root.querySelectorAll("[data-abs]").forEach(b=>b.onclick=()=>{noshowArm=null;A.absent(b.dataset.abs)});
  root.querySelectorAll("[data-delay]").forEach(b=>b.onclick=()=>{noshowArm=null;A.delay(b.dataset.delay)});
  root.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>A.up(b.dataset.up));
  root.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>A.cancel(b.dataset.rm,true));
  root.querySelectorAll("[data-forgive]").forEach(b=>b.onclick=()=>A.forgive(b.dataset.forgive));
  const ex2=root.querySelector('[data-a="ex2"]');if(ex2)ex2.onclick=()=>A.examples();
 }
 const off=Store.on(update);const iv=setInterval(update,5000);update();
 return{destroy(){off();clearInterval(iv)}};
}

/* ================= Screen (TV) ================= */
function ScreenView(root){
 let lastCalled={};
 function update(){
  if(!Store.ready){root.innerHTML=`<div class="loading">${t("connecting")}</div>`;return}
  const q=Q();const blink=new Set();
  q.inChair.forEach((x,i)=>{if(x&&lastCalled[i]!==undefined&&lastCalled[i]!==x.id){blink.add(i);chime(true)}lastCalled[i]=x?x.id:null});
  root.innerHTML=`<div class="tv"><div class="now"><h2>${t("tv_now")}</h2>
   ${q.inChair.map((x,i)=>`<div class="tvchair ${blink.has(i)?"called":""}"><div class="n num ${x?"":"free"}">${x?String(x.num).padStart(2,"0"):"–"}</div><div><b>${t("chair")} ${i+1}</b><span>${x?esc(x.name):t("b_free")}</span></div></div>`).join("")}
   <h2 style="margin-top:8px">${t("tv_next")}</h2><div class="nexts">${q.waiting.slice(0,6).map(x=>`<span class="num">${String(x.num).padStart(2,"0")}</span>`).join("")||`<span style="opacity:.5">–</span>`}</div></div>
   <div class="side2"><div><div class="clock num" data-clock>${hhmm(Date.now())}</div><div style="opacity:.85;margin-top:6px;font-weight:600">${esc(Store.shop.name)}</div></div>
    <div style="font-size:clamp(18px,2vw,24px);font-weight:700"><span class="num">${q.waiting.length}</span> ${t("tv_waiting")}<br><span style="opacity:.85;font-weight:500">${Store.shop.paused?t("paused"):t("tv_new",{m:mins(q.nextFree)})}</span></div>
    <div class="cta"><b>${t("tv_cta")}</b><span>${t("tv_cta2")}</span></div></div></div>`;
 }
 const off=Store.on(update);const iv=setInterval(update,15000);update();
 return{destroy(){off();clearInterval(iv)}};
}

/* ================= Demo ================= */
function DemoView(root){
 root.innerHTML=`<div class="demo"><div><div class="phone"><div class="notch"></div><div class="scr"><div data-k="c"></div></div></div><div class="demo-cap">${t("demo_cap1")}</div></div><div><div class="lbl" style="margin-bottom:10px">${t("demo_cap2")}</div><div data-k="b"></div></div></div>`;
 const c=ClientView(root.querySelector('[data-k="c"]'),"demo",false);const b=BarberView(root.querySelector('[data-k="b"]'));
 return{destroy(){c.destroy();b.destroy()}};
}

/* ================= Shell ================= */
const viewEl=document.getElementById("view");let current=null,currentName=null;
const VIEWS=["client","barber","screen","demo"];
function pinOk(){const p=(window.NOBTK_CONFIG||{}).barberPin;return !p||ls.get("nobtk-pin")===p}
function PinView(root,next){root.className="pin card";root.innerHTML=`<h2 style="font-size:22px">${t("pin_t")}</h2><p class="muted" style="margin:0">${t("pin_p")}</p><input id="pin-in" class="lang" type="password" inputmode="numeric" maxlength="8" style="font-size:24px;text-align:center;padding:12px"><div class="err" hidden></div><button class="btn pri" type="button">${t("pin_btn")}</button>`;
 const go=()=>{const v=root.querySelector("#pin-in").value.trim();if(v===(window.NOBTK_CONFIG||{}).barberPin){ls.set("nobtk-pin",v);mount(next)}else{const e=root.querySelector(".err");e.textContent=t("pin_bad");e.hidden=false}};
 root.querySelector("button").onclick=go;root.querySelector("#pin-in").onkeydown=e=>{if(e.key==="Enter")go()};return{destroy(){}}}
function mount(name){if(!VIEWS.includes(name))name="client";
 if(current)current.destroy();viewEl.innerHTML="";currentName=name;
 const host=document.createElement("div");viewEl.appendChild(host);
 current=(name!=="client"&&!pinOk())?PinView(host,name):name==="client"?ClientView(host,"main",true):name==="barber"?BarberView(host):name==="screen"?ScreenView(host):DemoView(host);
 document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===name));
}
function applyLang(){const app=document.getElementById("app");app.setAttribute("dir",lang==="ar"?"rtl":"ltr");app.setAttribute("lang",lang);
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
 document.querySelectorAll("#nav button").forEach(b=>b.textContent=t("nav_"+b.dataset.view));
 document.getElementById("langBtn").textContent=lang==="ar"?"FR":"العربية";updateModePill()}
function updateModePill(){const p=document.getElementById("modePill");if(!p)return;p.className="pill"+(Store.mode==="live"?" live":"");p.lastElementChild.textContent=Store.mode==="live"?t("live"):Store.mode==="local"?t("local"):t("connecting")}
document.getElementById("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;location.hash=b.dataset.view};
document.getElementById("langBtn").onclick=()=>{lang=lang==="ar"?"fr":"ar";ls.set("nobtk-lang",lang);applyLang();mount(currentName)};
window.addEventListener("hashchange",()=>mount(location.hash.slice(1)));
applyLang();mount(location.hash.slice(1));
(function(){const C=window.NOBTK_CONFIG||{};let db=null;
 try{if(C.firebase&&window.firebase){firebase.initializeApp(C.firebase);db=firebase.firestore()}}catch(e){console.warn(e)}
 if(db)startDb(db,C.shopId||"salon-1");else startLocal();updateModePill()})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
