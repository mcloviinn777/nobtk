<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin · NOBTK</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#15143A">
<link rel="icon" href="icon-admin-192.png">
<link rel="manifest" href="admin.webmanifest">
<link rel="apple-touch-icon" href="icon-admin-192.png">
<meta name="apple-mobile-web-app-title" content="NOBTK Admin">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F2F1FA;--surface:#FFFFFF;--surface-2:#E9E8F6;--ink:#15143A;--muted:#5D5C86;--line:#DEDDF0;--primary:#3A31D2;--primary-soft:#E4E2FF;--accent:#FFC53D;--accent-ink:#2B1E00;--ok:#0E6B4D;--ok-soft:#DDF4EA;--warn:#8A5300;--warn-soft:#FFF0D6;--bad:#B42332;--bad-soft:#FDE3E5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque","Manrope",sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{background:var(--ink);color:#fff;padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right))}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top b{font-family:"Bricolage Grotesque",sans-serif;font-size:21px;letter-spacing:.02em}
.tag{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:12px;padding:2px 8px;border-radius:6px}
main{max-width:1180px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}
.btn.pri{background:var(--primary);color:#fff}.btn.ghost{background:var(--surface-2)}.btn.danger{background:var(--bad-soft);color:var(--bad)}.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.top .btn.ghost{background:rgba(255,255,255,.12);color:#fff}
input[type=email],input[type=password],input[type=search],select{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:30px;line-height:1.15}
.stat span{color:var(--muted);font-weight:600;font-size:13px}
.stat.hl{background:var(--primary);color:#fff;border-color:var(--primary)}.stat.hl span{color:#D9D6FF}.stat.hl b{color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;border-radius:9px;padding:9px 14px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(21,20,58,.12)}
.list{display:flex;flex-direction:column;gap:10px}
.su{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 170px;gap:14px;align-items:center}
.su .nm b{font-size:16px}.su .nm div{color:var(--muted);font-size:13px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-weight:800;font-size:12px}
.st-nouveau{background:var(--primary-soft);color:var(--primary)}.st-contacte{background:var(--surface-2);color:var(--muted)}.st-essai{background:var(--warn-soft);color:var(--warn)}.st-payant{background:var(--ok-soft);color:var(--ok)}.st-annule{background:var(--bad-soft);color:var(--bad)}
details.more summary{cursor:pointer;color:var(--primary);font-weight:700;font-size:13px;margin-top:8px}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:10px;font-size:14px}
.det table{width:100%;border-collapse:collapse}.det td{padding:4px 0;border-bottom:1px solid var(--line)}.det td:last-child{text-align:right}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links a{color:var(--primary);font-weight:700}
#qr{background:#fff;padding:14px;border-radius:14px;width:max-content}
.poster{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--primary);border-radius:6px 6px 2px 2px;min-height:2px}
.bars b{font-size:12px;color:var(--ink)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li small{display:block;color:var(--muted)}
.days{font-weight:800;white-space:nowrap}
.days.urg{color:var(--bad)}
.lk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.lk a{display:block;padding:11px 12px;border-radius:12px;background:var(--surface-2);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.lk a small{display:block;font-weight:500;color:var(--muted)}
.lv-on{background:var(--ok-soft);color:var(--ok)}.lv-pause{background:var(--warn-soft);color:var(--warn)}.lv-idle{background:var(--surface-2);color:var(--muted)}.lv-off{background:var(--bad-soft);color:var(--bad)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:6px;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.3}}
.rowbtn{width:100%;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;font:inherit;color:inherit;text-align:left}
.rowbtn:hover{background:var(--bg)}
.tbl{width:100%;border-collapse:collapse;min-width:720px;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-size:12.5px;padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.pf-head{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.pf-grid h3{font-size:17px;margin-bottom:10px}
.pf-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pf{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.pf input,.pf select,textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;width:100%;font:inherit;color:var(--ink);font-weight:500}
textarea{resize:vertical}
.sv{display:grid;grid-template-columns:minmax(0,1fr) 80px 70px 36px;gap:6px}
.sv input{border:1.5px solid var(--line);border-radius:10px;padding:8px 9px;font:inherit;min-width:0}
.ibtn{border:0;background:var(--surface-2);border-radius:10px;cursor:pointer;font-size:18px;color:var(--muted)}
.hr{display:grid;grid-template-columns:minmax(0,1fr) 110px 110px;gap:6px;align-items:center}
.hr input[type=time]{border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;font:inherit}
.hist{max-height:220px;overflow:auto}
code{background:var(--surface-2);padding:2px 6px;border-radius:6px}
@media (max-width:760px){.su{grid-template-columns:1fr}}
@media print{.top,.tabs,.noprint{display:none!important}body{background:#fff}.card{border:0}}
</style>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="pdf.js"></script>
</head>
<body>
<header class="top"><div class="top-in"><img src="icon-192.png" width="34" height="34" alt=""><b>NOBTK</b><span class="tag">ADMIN</span><button class="btn sm" id="install" hidden style="margin-left:auto;background:var(--accent);color:var(--accent-ink)">Installer l'application</button><span style="margin-left:auto;font-size:13px;opacity:.8" id="who"></span><button class="btn ghost sm" id="logout" hidden>Se déconnecter</button></div></header>
<main id="main"><div class="empty">Chargement…</div></main>

<script>
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; const b = document.getElementById("install"); if (b) b.hidden = false; });
window.addEventListener("appinstalled", () => { const b = document.getElementById("install"); if (b) b.hidden = true; });
document.addEventListener("click", async (e) => { if (e.target && e.target.id === "install" && installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (x) {} installEvt = null; e.target.hidden = true; } });

const C = window.NOBTK_CONFIG || {};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUSES = [["nouveau","Nouveau"],["contacte","Contacté"],["essai","En essai"],["payant","Payant"],["annule","Annulé"]];
const SUB = [["essai","En essai"],["payant","Payant"],["suspendu","Suspendu"],["annule","Annulé"]];
const DEF_SVC = [["coupe","Coupe classique",50,20],["degrade","Dégradé",60,25],["barbe","Barbe",30,15],["combo","Coupe + Barbe",80,35],["enfant","Enfant (-12 ans)",40,15]];
const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const fmt = (n) => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const toD = (v) => v && v.toDate ? v.toDate() : (v ? new Date(v) : null);
const dateStr = (v) => { const d = toD(v); return d && !isNaN(d) ? d.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }) : "–"; };
const isoDay = (d) => { d = new Date(d); const p = (n) => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); };
const addMonths = (d, m) => { const x = new Date(d); x.setMonth(x.getMonth() + m); return x; };
const ago = (ts) => { const m = Math.round((Date.now() - ts) / 60000); if (m < 1) return "à l'instant"; if (m < 60) return "il y a " + m + " min"; const h = Math.round(m / 60); if (h < 24) return "il y a " + h + " h"; return "il y a " + Math.round(h / 24) + " j"; };
const hhmm = (ts) => new Date(ts).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const base = location.href.replace(/[^/]*([?#].*)?$/, "");
const wa = (p) => "https://wa.me/212" + String(p || "").replace(/\D/g, "").replace(/^0/, "");
const slugify = (s) => String(s || "salon").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 28) || "salon";
async function sha(x) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(x)); return [...new Uint8Array(b)].map((v) => v.toString(16).padStart(2, "0")).join(""); }
const newPin = () => String(Math.floor(1000 + Math.random() * 9000));
const monthlyOf = (x) => x.billing === "year" ? Math.round((x.price || 0) / 12) : (x.price || 0);
const tprice = (t, svcs) => t.price ?? ((svcs || []).find((s) => s.id === t.svc) || {}).price ?? ((DEF_SVC.find((s) => s[0] === t.svc) || [])[2] || 0);
const priceFor = (chairs, billing) => { const m = chairs <= 1 ? 99 : Math.min(299, 149 + 20 * Math.max(0, chairs - 5)); return billing === "year" ? m * 10 : m; };

if (!C.firebase || !window.firebase) {
  $("main").innerHTML = `<div class="card empty">Firebase n'est pas configuré. Ajoute la configuration dans <b>config.js</b>.</div>`;
} else {
  firebase.initializeApp(C.firebase);
  const auth = firebase.auth(), db = firebase.firestore();
  $("logout").onclick = () => auth.signOut();
  let stop = null;
  auth.onAuthStateChanged((u) => {
    if (stop) { stop(); stop = null; }
    $("logout").hidden = !u; $("who").textContent = u ? u.email : "";
    if (u) stop = dashboard(db); else login(auth);
  });
}

function login(auth) {
  $("main").innerHTML = `<form class="card" id="lf" style="max-width:400px;margin:40px auto;display:flex;flex-direction:column;gap:12px" novalidate>
    <h1 style="font-size:26px">Connexion admin</h1>
    <label style="font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:6px">Email<input type="email" id="em" autocomplete="username"></label>
    <label style="font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:6px">Mot de passe<input type="password" id="pw" autocomplete="current-password"></label>
    <div class="err" id="le" hidden></div>
    <button class="btn pri" type="submit">Se connecter</button>
    <p style="margin:0;color:var(--muted);font-size:13px">Le compte se crée dans Firebase › Authentication › Utilisateurs.</p></form>`;
  $("lf").onsubmit = async (e) => {
    e.preventDefault();
    try { await auth.signInWithEmailAndPassword($("em").value.trim(), $("pw").value); }
    catch (x) { const el = $("le"); el.textContent = "Email ou mot de passe incorrect."; el.hidden = false; }
  };
}

function dashboard(db) {
  let tab = "overview", pid = null, mountedPid = null, qrFor = null;
  let signups = [], profiles = [], filter = "all", q = "";
  const shopDocs = {}, shopTickets = {}, shopUnsubs = {}, unsubs = [];
  $("main").innerHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between"><h1 style="font-size:30px">Tableau de bord</h1>
      <div class="tabs" role="group"><button data-tab="overview" aria-pressed="true">Aperçu</button><button data-tab="salons" aria-pressed="false">Salons</button><button data-tab="signups" aria-pressed="false">Inscriptions</button><button data-tab="qr" aria-pressed="false">QR code vitrine</button></div></div>
    <div id="view"></div>`;
  const setTab = (t) => { tab = t; if (t !== "salons") pid = null; document.querySelectorAll("[data-tab]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.tab === t)); mountedPid = null; render(); window.scrollTo(0, 0); };
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => setTab(b.dataset.tab));

  function watchShop(id) {
    if (shopUnsubs[id]) return;
    const a = db.doc("shops/" + id).onSnapshot((s) => { shopDocs[id] = s.exists ? s.data() : null; render(true); }, () => {});
    const b = db.collection("shops/" + id + "/tickets").onSnapshot((s) => { shopTickets[id] = s.docs.map((d) => ({ id: d.id, ...d.data() })); render(true); }, () => {});
    shopUnsubs[id] = () => { a(); b(); };
  }
  unsubs.push(db.collection("signups").orderBy("createdAt", "desc").onSnapshot((s) => { signups = s.docs.map((d) => ({ id: d.id, ...d.data() })); render(true); }, (e) => { console.warn(e); $("view").innerHTML = `<div class="err">Lecture refusée. Vérifie que ton compte est bien connecté.</div>`; }));
  unsubs.push(db.collection("shopProfiles").onSnapshot((s) => { profiles = s.docs.map((d) => ({ id: d.id, ...d.data() })); profiles.forEach((p) => watchShop(p.id)); render(true); }, (e) => console.warn(e)));
  watchShop(C.shopId || "salon-1");
  const tick = setInterval(() => render(true), 30000);

  // ---------- live status of a shop: who's working ----------
  function live(id) {
    const sd = shopDocs[id] || {}; const seen = sd.lastSeen || 0; const on = Date.now() - seen < 3 * 60000;
    if (shopDocs[id] === null) return { k: "off", l: "Pas activé" };
    if (sd.active === false) return { k: "off", l: "Suspendu" };
    if (on && sd.paused) return { k: "pause", l: "En pause" };
    if (on) return { k: "on", l: "En service" };
    return { k: "idle", l: seen ? "Hors ligne · " + ago(seen) : "Jamais connecté" };
  }
  const liveChip = (id) => { const s = live(id); return `<span class="chip lv-${s.k}">${s.k === "on" ? '<i class="pulse"></i>' : ""}${esc(s.l)}</span>`; };
  function today(id) {
    const ts = shopTickets[id] || []; const sv = (shopDocs[id] || {}).services;
    const done = ts.filter((t) => t.status === "done");
    const last = ts.reduce((m, t) => Math.max(m, t.created || 0), 0);
    return { waiting: ts.filter((t) => t.status === "waiting").length, chair: ts.filter((t) => t.status === "chair" || t.status === "called").length, served: done.length,
      revenue: done.reduce((a, t) => a + tprice(t, sv), 0), noshow: ts.filter((t) => t.status === "noshow").length, app: ts.filter((t) => t.src === "app").length, total: ts.length, last };
  }
  const subChip = (st) => `<span class="chip st-${st === "suspendu" ? "annule" : st}">${esc((SUB.find((x) => x[0] === st) || [, st || "–"])[1])}</span>`;

  function render(fromData) {
    const v = $("view"); if (!v) return;
    if (tab === "overview") return renderOverview(v);
    if (tab === "signups") { if (fromData && document.activeElement && document.activeElement.id === "q") return; return renderSignups(v); }
    if (tab === "salons") { if (pid) { if (mountedPid !== pid) return renderProfile(v); return updateProfileLive(); } return renderSalons(v); }
    if (tab === "qr" && !fromData) return renderQr(v);
  }

  // ---------- Overview ----------
  function renderOverview(v) {
    const by = (st) => signups.filter((x) => (x.status || "nouveau") === st);
    const pays = profiles.filter((p) => p.status === "payant"), trials = profiles.filter((p) => p.status === "essai");
    const mrr = pays.reduce((a, x) => a + monthlyOf(x), 0), potential = trials.reduce((a, x) => a + monthlyOf(x), 0);
    const now = Date.now();
    const ending = trials.map((x) => ({ x, d: toD(x.trialEnds) })).filter((o) => o.d).sort((a, b) => a.d - b.d).slice(0, 6);
    const ids = profiles.map((p) => p.id); const states = ids.map((id) => live(id).k);
    const working = profiles.filter((p) => live(p.id).k === "on");
    const weeks = []; const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
    for (let i = 7; i >= 0; i--) { const a = new Date(start); a.setDate(a.getDate() - i * 7); const b = new Date(a); b.setDate(b.getDate() + 7);
      weeks.push({ label: a.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }), n: signups.filter((x) => { const d = toD(x.createdAt); return d && d >= a && d < b; }).length }); }
    const maxW = Math.max(1, ...weeks.map((w) => w.n));
    const totalToday = ids.reduce((a, id) => a + today(id).served, 0), revToday = ids.reduce((a, id) => a + today(id).revenue, 0);
    v.innerHTML = `
      <div class="stats" style="margin-bottom:16px">
        <div class="card stat hl"><b>${fmt(mrr)} DH</b><span>Revenu mensuel (salons payants)</span></div>
        <div class="card stat"><b>${working.length} / ${profiles.length}</b><span>Salons en service maintenant</span></div>
        <div class="card stat"><b>${pays.length}</b><span>Salons payants</span></div>
        <div class="card stat"><b>${trials.length}</b><span>En essai gratuit</span></div>
        <div class="card stat"><b>${by("nouveau").length}</b><span>Inscriptions à traiter</span></div>
        <div class="card stat"><b>${fmt(potential)} DH</b><span>En plus si les essais paient</span></div>
      </div>
      <div class="ov">
        <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px"><h3 style="font-size:17px">Qui travaille maintenant</h3><span class="muted" style="font-size:13px">${states.filter((k) => k === "on").length} en service · ${states.filter((k) => k === "pause").length} en pause · ${states.filter((k) => k === "idle").length} hors ligne</span></div>
          ${profiles.length ? profiles.slice().sort((a, b) => ({ on: 0, pause: 1, idle: 2, off: 3 }[live(a.id).k]) - ({ on: 0, pause: 1, idle: 2, off: 3 }[live(b.id).k])).map((p) => { const t = today(p.id); return `<button class="li rowbtn" data-open="${esc(p.id)}" type="button"><span style="text-align:left"><b>${esc(p.shop)}</b><small>${esc(p.city)} · ${t.served} servis aujourd'hui · ${t.waiting} en attente</small></span>${liveChip(p.id)}</button>`; }).join("") : `<div class="empty">Aucun salon activé. Active un salon depuis l'onglet Inscriptions, ou ajoute le salon pilote dans l'onglet Salons.</div>`}
          <p class="muted" style="margin:8px 0 0;font-size:12.5px">« En service » : le tableau du barbier est ouvert en ce moment. Aujourd'hui, tous salons : ${totalToday} clients servis, ${fmt(revToday)} DH.</p>
        </div>

  }

  function updateProfileLive() {
    const p = P(); const box = $("pf-live"); if (!p || !box) return;
    const id = p.id, t = today(id); const end = toD(p.status === "essai" ? p.trialEnds : p.nextPayment); const left = end ? Math.ceil((end - Date.now()) / 864e5) : null;
    $("pf-chips").innerHTML = liveChip(id) + subChip(p.status) + (end ? `<span class="chip" style="background:var(--surface-2);color:var(--muted)">${p.status === "essai" ? "Fin d'essai" : "Prochain paiement"} : ${dateStr(end)}${left != null ? " (" + (left < 0 ? "dépassé" : left + " j") + ")" : ""}</span>` : "");
    const days = daysData.id === id ? daysData.list : [];
    const maxD = Math.max(1, ...days.map((d) => d.served || 0));
    const tot = days.reduce((a, d) => ({ s: a.s + (d.served || 0), r: a.r + (d.revenue || 0), n: a.n + (d.noshow || 0) }), { s: 0, r: 0, n: 0 });
    const hours = Array(24).fill(0); days.forEach((d) => (d.byHour || []).forEach((n, h) => hours[h] += n || 0));
    const top = hours.map((n, h) => ({ n, h })).filter((x) => x.n).sort((a, b) => b.n - a.n).slice(0, 3);
    const hMax = Math.max(1, ...hours.slice(8, 24));
    box.innerHTML = `
      <div class="stats" style="margin:14px 0">
        <div class="card stat"><b>${t.waiting}</b><span>En attente maintenant</span></div>
        <div class="card stat"><b>${t.chair}</b><span>Au fauteuil</span></div>
        <div class="card stat"><b>${t.served}</b><span>Servis aujourd'hui</span></div>
        <div class="card stat hl"><b>${fmt(t.revenue)} DH</b><span>Chiffre du jour</span></div>
        <div class="card stat"><b>${t.noshow}</b><span>Absents aujourd'hui</span></div>
        <div class="card stat"><b>${t.last ? hhmm(t.last) : "–"}</b><span>Dernier ticket</span></div>
      </div>
      <div class="ov" style="margin-bottom:16px">
        <div class="card"><h3 style="font-size:17px">30 derniers jours</h3>
          ${days.length ? `<div class="bars">${days.map((d) => `<div title="${esc(d.date)} : ${d.served || 0} clients"><b>${d.served || ""}</b><i style="height:${Math.round((d.served || 0) / maxD * 100)}%"></i><span>${esc(String(d.date).slice(8))}</span></div>`).join("")}</div>
            <p class="muted" style="margin:8px 0 0;font-size:13px">${tot.s} clients · ${fmt(tot.r)} DH · ${tot.n} absents · moyenne ${Math.round(tot.s / days.length)} clients par jour</p>`
            : `<div class="empty">Les journées apparaissent ici chaque fois que le barbier appuie sur « Nouvelle journée ».</div>`}
        </div>
        <div class="card"><h3 style="font-size:17px">Heures les plus chargées</h3>
          ${top.length ? `<div class="bars" style="height:110px">${hours.slice(8, 24).map((n, i) => `<div><i style="height:${Math.round(n / hMax * 100)}%;${top.some((x) => x.h === i + 8) ? "background:var(--accent)" : ""}"></i><span>${i + 8}h</span></div>`).join("")}</div>
            <p class="muted" style="margin:8px 0 0;font-size:13px">Pic : ${top.map((x) => x.h + "h–" + (x.h + 1) + "h").join(", ")}</p>`
            : `<div class="empty">Pas encore assez de journées enregistrées.</div>`}
        </div>
      </div>`;
    const h = $("pf-hist"); if (h) h.innerHTML = (p.history || []).slice().reverse().map((e) => `<div class="li"><span>${esc(e.text)}</span><small class="muted">${dateStr(e.at)}</small></div>`).join("") || `<div class="muted" style="font-size:13px">Rien pour l'instant.</div>`;
  }

  // ---------- Sign-ups ----------
  function renderSignups(v) {
    const count = (st) => signups.filter((x) => (x.status || "nouveau") === st).length;
    const list = signups.filter((x) => (filter === "all" || (x.status || "nouveau") === filter) && (!q || JSON.stringify([x.shop, x.owner, x.city, x.phone]).toLowerCase().includes(q)));
    v.innerHTML = `
      <div class="stats" style="margin-bottom:16px">
        <div class="card stat"><b>${signups.length}</b><span>Inscriptions</span></div>
        <div class="card stat"><b>${count("nouveau")}</b><span>À contacter</span></div>
        <div class="card stat"><b>${count("essai")}</b><span>En essai gratuit</span></div>
        <div class="card stat"><b>${count("payant")}</b><span>Payants</span></div>
      </div>
      <div class="card" style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;gap:10px;flex-wrap:wrap" class="noprint">
          <input type="search" id="q" placeholder="Chercher un salon, un nom, une ville…" value="${esc(q)}" style="flex:1 1 240px">
          <select id="flt" style="width:auto"><option value="all">Tous les statuts</option>${STATUSES.map(([k, l]) => `<option value="${k}" ${filter === k ? "selected" : ""}>${l}</option>`).join("")}</select>
          <a class="btn ghost" href="inscription.html" target="_blank" rel="noopener" style="text-decoration:none">Ouvrir le formulaire</a>
        </div>
        <div class="list">${list.length ? list.map(row).join("") : `<div class="empty">${signups.length ? "Aucun résultat." : "Aucune inscription pour l'instant. Partage le formulaire avec les barbiers : " + esc(base + "inscription.html")}</div>`}</div>
      </div>`;
    $("q").oninput = (e) => { q = e.target.value.toLowerCase(); const pos = e.target.selectionStart; renderSignups(v); const n = $("q"); n.focus(); n.setSelectionRange(pos, pos); };
    $("flt").onchange = (e) => { filter = e.target.value; renderSignups(v); };
    v.querySelectorAll("[data-status]").forEach((s) => s.onchange = () => db.collection("signups").doc(s.dataset.status).update({ status: s.value }));
    v.querySelectorAll("[data-activate]").forEach((b) => b.onclick = () => { const x = signups.find((y) => y.id === b.dataset.activate); if (x) activate(x, b); });
    bindOpen(v);
    v.querySelectorAll("[data-pdf]").forEach((b) => b.onclick = async () => {
      const x = signups.find((y) => y.id === b.dataset.pdf); if (!x) return;
      const l = b.textContent; b.disabled = true; b.textContent = "Création…";
      try { await window.NOBTK_PDF(x, { share: true }); } catch (e) { console.warn(e); }
      b.disabled = false; b.textContent = l;
    });
    v.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
      if (b.dataset.armed) { db.collection("signups").doc(b.dataset.del).delete(); return; }
      b.dataset.armed = "1"; b.textContent = "Confirmer la suppression"; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "Supprimer"; } }, 4000);
    });
  }
  function row(x) {
    const st = x.status || "nouveau";
    const plan = (x.plan === "solo" ? "Solo" : "Salon") + " · " + (x.chairs || 1) + " fauteuil" + ((x.chairs || 1) > 1 ? "s" : "");
    const svcRows = (x.services || []).map((s) => `<tr><td>${esc(s.name)} <span style="color:var(--muted)">· ${s.minutes} min</span></td><td><b>${s.price} DH</b></td></tr>`).join("");
    const hourRows = (x.hours || []).map((h) => `<tr><td>${esc(h.day)}</td><td>${h.open ? esc(h.from) + " – " + esc(h.to) : "<span style='color:var(--muted)'>Fermé</span>"}</td></tr>`).join("");
    return `<div class="card" style="padding:14px 16px">
      <div class="su">
        <div class="nm"><b>${esc(x.shop)}</b> <span class="chip st-${st}">${esc((STATUSES.find((s) => s[0] === st) || [, st])[1])}</span><div>${esc(x.owner)} · ${esc(x.city)} · inscrit le ${dateStr(x.createdAt)}</div></div>
        <div style="font-size:14px"><b>${esc(plan)}</b><div style="color:var(--muted)">${fmt(x.price || 0)} DH / ${x.billing === "year" ? "an" : "mois"}</div></div>
        ${x.shopId ? `<button class="btn ghost sm" data-open="${esc(x.shopId)}" type="button">Voir le profil</button>` : `<button class="btn pri sm" data-activate="${esc(x.id)}" type="button">Activer le salon</button>`}
      </div>
      <details class="more"><summary>Détails</summary><div class="det">
        <div><h3 style="font-size:15px;margin-bottom:6px">Contact</h3>
          <div>${esc(x.phone)} · <a href="${esc(wa(x.phone))}" target="_blank" rel="noopener">WhatsApp</a></div>
          <div>${x.email ? esc(x.email) : "<span style='color:var(--muted)'>Pas d'email</span>"}</div>
          <div>${esc(x.address || "")}</div>
          <div style="color:var(--muted)">${x.barbers || 1} barbier(s) · Source : ${esc(x.source || "–")}</div>
          <label style="display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px">Statut <select data-status="${esc(x.id)}" style="width:auto;padding:6px 8px">${STATUSES.map(([k, l]) => `<option value="${k}" ${k === st ? "selected" : ""}>${l}</option>`).join("")}</select></label>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn ghost sm" data-pdf="${esc(x.id)}" type="button">Télécharger le PDF</button><button class="btn danger sm" data-del="${esc(x.id)}" type="button">Supprimer</button></div></div>
        <div><h3 style="font-size:15px;margin-bottom:6px">Services</h3><table>${svcRows}</table></div>
        <div><h3 style="font-size:15px;margin-bottom:6px">Horaires</h3><table>${hourRows}</table></div>
      </div></details></div>`;
  }

  // ---------- QR poster ----------
  function renderQr(v) {
    const options = profiles.map((p) => [p.id, p.shop]); const pilot = C.shopId || "salon-1";
    if (!options.find((o) => o[0] === pilot)) options.unshift([pilot, (shopDocs[pilot] || {}).name || "Salon pilote"]);
    const sel = qrFor && options.find((o) => o[0] === qrFor) ? qrFor : options[0][0];
    const name = (options.find((o) => o[0] === sel) || [, ""])[1];
    const url = base + "index.html?s=" + encodeURIComponent(sel);
    v.innerHTML = `<div class="card noprint" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label style="font-weight:700">Salon</label><select id="qrsel" style="width:auto">${options.map(([i, n]) => `<option value="${esc(i)}" ${i === sel ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>
      <div class="card poster">
      <div id="qr"></div>
      <div style="display:flex;flex-direction:column;gap:10px;max-width:420px">
        <div style="font-weight:800;color:var(--primary)">${esc(name)}</div>
        <h2 style="font-size:28px">Prenez votre ticket sur NOBTK</h2>
        <p style="margin:0;color:var(--muted)">Scannez, choisissez votre service, et revenez quand c'est votre tour.</p>
        <p style="margin:0;font-weight:700;direction:rtl;font-size:18px">خود نوبتك من التيليفون، و رجع ملي توصل نوبتك</p>
        <code style="font-size:13px;word-break:break-all">${esc(url)}</code>
        <div class="noprint" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" type="button" id="pr">Imprimer l'affiche</button></div>
      </div></div>`;
    try { new QRCode($("qr"), { text: url, width: 240, height: 240, colorDark: "#15143A", colorLight: "#FFFFFF" }); } catch (e) { $("qr").textContent = url; }
    $("pr").onclick = () => window.print();
    $("qrsel").onchange = (e) => { qrFor = e.target.value; renderQr(v); };
  }

  render();
  return () => { unsubs.forEach((f) => f()); Object.values(shopUnsubs).forEach((f) => f()); clearInterval(tick); };
}
</script>
</body>
</html>
