name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        working-directory: android
        run: gradle assembleBarberDebug assembleAdminDebug --no-daemon --stacktrace

      - name: Rename the APKs
        run: |
          cp android/app/build/outputs/apk/barber/debug/app-barber-debug.apk NOBTK.apk
          cp android/app/build/outputs/apk/admin/debug/app-admin-debug.apk NOBTK-Admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NOBTK-apk
          path: |
            NOBTK.apk
            NOBTK-Admin.apk

      - name: Publish the APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: NOBTK (applications Android)
          make_latest: true
          files: |
            NOBTK.apk
            NOBTK-Admin.apk
          body: |
            **NOBTK.apk** : l'application du barbier (tableau du salon). À installer sur le téléphone du barbier.
            **NOBTK-Admin.apk** : ton tableau de bord privé (inscriptions, revenus, salons). À installer seulement sur ton téléphone.
            Ouvre le fichier téléchargé pour l'installer.
            Android demandera d'autoriser l'installation depuis cette source : c'est normal pour une appli hors Play Store.
