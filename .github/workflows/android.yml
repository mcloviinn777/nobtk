name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NOBTK.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NOBTK-apk
          path: NOBTK.apk

      - name: Publish the APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: NOBTK pour le barbier (APK)
          make_latest: true
          files: NOBTK.apk
          body: |
            Application NOBTK pour le barbier (Android).
            Télécharge **NOBTK.apk** ci-dessous sur le téléphone du barbier, puis ouvre le fichier pour l'installer.
            Android demandera d'autoriser l'installation depuis cette source : c'est normal pour une appli hors Play Store.
